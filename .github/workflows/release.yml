name: Release UnityEvalTool

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish npm packages and create the GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Read committed version
        shell: bash
        run: echo "version=$(node -p \"require('./version.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Validate synchronized package versions
        working-directory: Broker
        run: node --input-type=module -e "import { resolveAndValidateVersion } from './npm/scripts/version.mjs'; console.log(resolveAndValidateVersion(process.cwd()));"
      - name: Build Native Broker
        run: dotnet build Broker/UnityEvalTool.Broker.slnx -c Release
      - name: Test Native Broker
        run: dotnet test Broker/tests/UnityEvalTool.Broker.Tests/UnityEvalTool.Broker.Tests.csproj -c Release --no-build
      - name: Test Roslyn source generator
        run: dotnet test Roslyn/UnityEvalToolRoslyn.sln -c Release
      - name: Verify committed Unity analyzer
        run: cmp Roslyn/src/UnityEvalTool.SourceGenerator/bin/Release/netstandard2.0/UnityEvalTool.SourceGenerator.dll Packages/com.yuzetoolkit.unityevaltool/Analyzers/UnityEvalTool.SourceGenerator.dll

  native:
    needs: validate
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and pack native npm package
        working-directory: Broker
        env:
          UNITY_EVAL_TOOL_PLATFORM: ${{ matrix.platform }}
          UNITY_EVAL_TOOL_ARCH: ${{ matrix.arch }}
        run: node npm/scripts/pack-platform.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}-${{ matrix.arch }}
          path: Broker/artifacts/npm/*.tgz
          if-no-files-found: error

  root:
    needs: validate
    name: npm entry package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack entry package
        working-directory: Broker
        run: node npm/scripts/pack-root.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-root
          path: Broker/artifacts/npm/*.tgz
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: [validate, native, root]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: packages
          merge-multiple: true
      - name: Publish native packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in packages/*-darwin-*.tgz packages/*-linux-*.tgz packages/*-win32-*.tgz; do
            npm publish "$package" --access public
          done
          npm publish "packages/yuzetoolkit-unityevaltool-${{ needs.validate.outputs.version }}.tgz" --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.validate.outputs.version }}" packages/*.tgz --repo "${{ github.repository }}" --generate-notes --title "UnityEvalTool v${{ needs.validate.outputs.version }}"
