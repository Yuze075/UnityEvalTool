name: Release UnityEvalTool

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version for all npm packages and the GitHub release
        required: true
        default: 2.0.0
      publish:
        description: Publish npm packages and create the GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  native:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and pack native npm package
        working-directory: Broker
        env:
          UNITY_EVAL_TOOL_VERSION: ${{ inputs.version }}
          UNITY_EVAL_TOOL_PLATFORM: ${{ matrix.platform }}
          UNITY_EVAL_TOOL_ARCH: ${{ matrix.arch }}
        run: node npm/scripts/pack-platform.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}-${{ matrix.arch }}
          path: Broker/artifacts/npm/*.tgz
          if-no-files-found: error

  root:
    name: npm entry package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack entry package
        working-directory: Broker
        env:
          UNITY_EVAL_TOOL_VERSION: ${{ inputs.version }}
        run: node npm/scripts/pack-root.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-root
          path: Broker/artifacts/npm/*.tgz
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: [native, root]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: packages
          merge-multiple: true
      - name: Publish native packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in packages/*-darwin-*.tgz packages/*-linux-*.tgz packages/*-win32-*.tgz; do
            npm publish "$package" --access public
          done
          npm publish "packages/yuzetoolkit-unityevaltool-${{ inputs.version }}.tgz" --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" packages/*.tgz --repo "${{ github.repository }}" --generate-notes --title "UnityEvalTool v${{ inputs.version }}"
